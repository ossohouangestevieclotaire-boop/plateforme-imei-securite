<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sécurité Nationale - IMEI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-bottom: 20px;
            color: #f87171;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-valider {
            width: 100%;
            padding: 12px;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-valider:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Inscription / Connexion</h2>
        <form id="authForm">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" placeholder="REDMI" required>
            </div>
            
            <div class="form-group">
                <label>Adresse E-mail</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-valider">Valider</button>
        </form>
    </div>

    <!-- Script JavaScript pour rendre le bouton fonctionnel avec l'API Vercel -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const authForm = document.getElementById('authForm');
        
        if (authForm) {
          authForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Empêche le rechargement de la page

            const nom = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password || !nom) {
              alert("Veuillez remplir tous les champs obligatoires.");
              return;
            }

            try {
              // Envoi vers votre API Vercel (/api/index)
              const response = await fetch('/api/index', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'register', nom, email, password })
              });

              const data = await response.json();

              if (response.ok) {
                alert("Inscription ou validation réussie !");
                // Vous pouvez ajouter ici une redirection vers le tableau de bord
              } else {
                alert("Erreur : " + (data.error || "Impossible de valider"));
              }
            } catch (err) {
              console.error("Erreur réseau :", err);
              alert("Erreur de connexion avec le serveur.");
            }
          });
        }
      });
    </script>
</body>
</html>
