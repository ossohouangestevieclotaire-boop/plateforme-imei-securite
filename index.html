<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sécurité Nationale - IMEI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-bottom: 20px;
            color: #f87171;
            text-align: center;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #94a3b8;
            font-weight: bold;
        }
        .tab.active {
            color: #f87171;
            border-bottom: 2px solid #f87171;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-valider {
            width: 100%;
            padding: 12px;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-valider:hover {
            background-color: #047857;
        }
        .options-links {
            margin-top: 15px;
            text-align: center;
        }
        .options-links a {
            color: #38bdf8;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .options-links a:hover {
            text-decoration: underline;
        }
        /* Dashboard caché par défaut */
        #dashboard-section {
            display: none;
        }
        .dashboard-container {
            max-width: 800px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- SECTION AUTHENTIFICATION (Connexion / Inscription) -->
    <div class="container" id="auth-container">
        <h2 id="form-title">Connexion</h2>
        
        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchMode('login')">Se Connecter</div>
            <div class="tab" id="tab-register" onclick="switchMode('register')">S'inscrire</div>
        </div>

        <form id="authForm">
            <div class="form-group" id="group-username" style="display: none;">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" placeholder="Votre nom">
            </div>
            
            <div class="form-group">
                <label>Adresse E-mail</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-valider" id="submit-btn">Se Connecter</button>
            
            <div class="options-links">
                <a onclick="forgotPassword()">Mot de passe oublié ?</a>
            </div>
        </form>
    </div>

    <!-- SECTION TABLEAU DE BORD (S'affiche après connexion/inscription réussie) -->
    <div class="dashboard-container" id="dashboard-section">
        <h2>Espace de Sécurité & Suivi IMEI</h2>
        <p id="welcome-msg">Bienvenue sur votre tableau de bord souverain.</p>
        
        <div style="margin-top: 20px; background: #0f172a; padding: 20px; border-radius: 8px;">
            <h3>Enregistrer ou Déclarer un Appareil</h3>
            <div class="form-group">
                <label>Numéro IMEI (15 chiffres)</label>
                <input type="text" id="imei-input" placeholder="Ex: 351209350057636" maxlength="15">
            </div>
            <button class="btn-valider" onclick="enregistrerImei()" style="background-color: #2563eb;">Enregistrer / Mettre à jour l'appareil</button>
        </div>

        <div style="margin-top: 20px; text-align: right;">
            <button onclick="logout()" style="background: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Se Déconnecter</button>
        </div>
    </div>

    <!-- SCRIPT DE GESTION -->
    <script>
        let currentMode = 'login'; // 'login' ou 'register'

        function switchMode(mode) {
            currentMode = mode;
            const title = document.getElementById('form-title');
            const userGroup = document.getElementById('group-username');
            const submitBtn = document.getElementById('submit-btn');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (mode === 'login') {
                title.innerText = "Connexion";
                userGroup.style.display = 'none';
                submitBtn.innerText = "Se Connecter";
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                title.innerText = "Inscription";
                userGroup.style.display = 'block';
                submitBtn.innerText = "S'inscrire";
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        // Gestion de la soumission du formulaire (Connexion / Inscription)
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const nom = document.getElementById('username').value.trim();

            if (currentMode === 'register' && !nom) {
                alert("Veuillez entrer un nom d'utilisateur.");
                return;
            }

            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: currentMode, 
                        nom, 
                        email, 
                        password 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(currentMode === 'login' ? "Connexion réussie !" : "Inscription réussie ! Vous pouvez maintenant gérer vos appareils.");
                    
                    if (data.nom) {
                        document.getElementById('welcome-msg').innerText = `Bienvenue, ${data.nom} sur votre tableau de bord.`;
                    }

                    // Basculer vers le tableau de bord
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                } else {
                    alert("Erreur : " + (data.error || "Action non autorisée. Veuillez vérifier vos identifiants ou vous inscrire."));
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Erreur de connexion avec le serveur.");
            }
        });

        // Gestion du mot de passe oublié relié à l'API
        async function forgotPassword() {
            const email = prompt("Entrez votre adresse e-mail enregistrée pour recevoir le lien de réinitialisation :");
            if (!email) return;

            try {
                const response = await fetch('/api/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'forgot-password', email })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(data.message);
                } else {
                    alert("Erreur : " + (data.error || "Impossible d'envoyer le lien."));
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Erreur de connexion avec le serveur.");
            }
        }

        function logout() {
            document.getElementById('auth-container').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('authForm').reset();
        }

        function enregistrerImei() {
            const imei = document.getElementById('imei-input').value.trim();
            if (imei.length !== 15) {
                alert("Le numéro IMEI doit comporter exactement 15 chiffres.");
                return;
            }
            alert("Appareil enregistré avec succès dans la base de données !");
            document.getElementById('imei-input').value = '';
        }
    </script>
</body>
</html>
